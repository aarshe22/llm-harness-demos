<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a2530"/>
<title>Coral Cove — Tropical Disaster Simulator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; background:#0a2530; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
body { user-select:none; -webkit-user-select:none; }
canvas { display:block; }
#hud { position:fixed; top:14px; left:16px; z-index:10; color:#fff; pointer-events:none; }
#card { background:rgba(10,25,35,.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:12px 18px; }
#card h1 { font-size:17px; font-weight:700; letter-spacing:.4px; }
#cond { font-size:13px; opacity:.92; margin-top:3px; }
#wind { font-size:12px; opacity:.65; margin-top:2px; font-variant-numeric:tabular-nums; }
#mute { position:fixed; top:14px; right:16px; z-index:10; width:46px; height:46px; border-radius:12px; background:rgba(10,25,35,.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.14); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
#mute svg { width:22px; height:22px; }
#bar { position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; justify-content:center; align-items:flex-end; gap:10px; padding:12px 14px 16px; }
#bar .grp { display:flex; gap:10px; }
.wbtn { flex:0 1 116px; min-width:76px; min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 8px; border-radius:16px; border:1px solid rgba(255,255,255,.16); background:rgba(10,25,35,.5); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:rgba(255,255,255,.85); cursor:pointer; transition:background .2s,color .2s,transform .1s,border-color .2s; }
.wbtn svg { width:26px; height:26px; }
.wbtn span { font-size:11.5px; font-weight:600; letter-spacing:.3px; white-space:nowrap; }
.wbtn:hover { background:rgba(30,55,70,.6); }
.wbtn:active { transform:scale(.94); }
.wbtn.active { background:rgba(255,214,120,.22); border-color:rgba(255,214,120,.65); color:#ffd878; }
.wbtn.disaster.active { background:rgba(255,110,90,.25); border-color:rgba(255,130,100,.7); color:#ff9d85; }
.sep { width:1px; height:46px; background:rgba(255,255,255,.18); align-self:center; }
#hint { position:fixed; left:0; right:0; bottom:104px; text-align:center; color:rgba(255,255,255,.75); font-size:12.5px; z-index:9; pointer-events:none; transition:opacity 1s; text-shadow:0 1px 4px rgba(0,0,0,.5); }
</style>
</head>
<body>

  <div id="card">

    <div id="wind">Wind 6 kt</div>

</div>
<button id="mute" aria-label="Toggle sound"></button>

<div id="bar">
  <div class="grp">

      <span>Sunny</span>

    <button class="wbtn" data-w="rain" title="Rain">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6M8 14v6M12 16v6"/></svg>
      <span>Rain</span>
    </button>
    <button class="wbtn" data-w="storm" title="Thunderstorm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M13 11l-3 5h4l-3 5"/></svg>
      <span>Storm</span>
    </button>
    <button class="wbtn" data-w="hurricane" title="Hurricane">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 0 1 9 9"/><path d="M12 21a9 9 0 0 1-9-9"/><path d="M12 8a4 4 0 0 1 4 4"/><path d="M12 16a4 4 0 0 1-4-4"/><circle cx="12" cy="12" r="1"/></svg>
      <span>Hurricane</span>
    </button>
  </div>
  <div class="sep"></div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M17 12a5 5 0 1 1-5-5"/><path d="M13.5 12a1.5 1.5 0 1 1-1.5-1.5"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="1.6"/><path d="M12 10.4 9.2 5.6A7.5 7.5 0 0 1 14.8 5.6Z" fill="currentColor" stroke="none" transform="rotate(0 12 12)"/><path d="M12 10.4 9.2 5.6A7.5 7.5 0 0 1 14.8 5.6Z" fill="currentColor" stroke="none" transform="rotate(120 12 12)"/><path d="M12 10.4 9.2 5.6A7.5 7.5 0 0 1 14.8 5.6Z" fill="currentColor" stroke="none" transform="rotate(240 12 12)"/><circle cx="12" cy="12" r="9"/></svg>
      <span>Airburst</span>
    </button>
    <button class="wbtn disaster" data-d="meteor" title="Meteor strike">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="16" r="4"/><path d="M12 12 21 3M14 15l5-2M9 10l2-5"/></svg>
      <span>Meteor</span>
    </button>
    <button class="wbtn disaster" data-d="ufo" title="UFO abduction">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7.5 10.5a4.5 4.5 0 0 1 9 0"/><ellipse cx="12" cy="12.5" rx="9.5" ry="3"/><path d="M9.5 15.5 8 21M14.5 15.5 16 21"/></svg>
      <span>UFO</span>
    </button>
    <button class="wbtn disaster" data-d="babel" title="Tower of Babel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V9l3-2V4h2v2h4V4h2v3l3 2v12"/><path d="M9 21v-4h6v4M9 11h6M9 15h6"/></svg>
      <span>Babel</span>
    </button>
    <button class="wbtn disaster" data-d="terraform" title="Terraform">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M4 20l4-9 4 5 3-7 5 11"/><circle cx="7" cy="4" r="2"/></svg>
      <span>Terraform</span>
    </button>
    <button class="wbtn disaster" data-d="godzilla" title="Godzilla">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 19h20M5 19l1-5 2 2 2-6 2 4 2-7 2 5 3-2 2 9"/><circle cx="19" cy="6" r="1"/></svg>
      <span>Godzilla</span>
    </button>
    <button class="wbtn disaster" data-d="ice" title="Ice age">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M4 7l16 10M20 7 4 17M12 2l-2.5 2.5M12 2l2.5 2.5M12 22l-2.5-2.5M12 22l2.5-2.5M4 7l3.2.8M4 7l-.8 3.2M20 17l-3.2-.8M20 17l.8-3.2M20 7l-3.2.8M20 7l.8 3.2M4 17l3.2-.8M4 17l-.8-3.2"/></svg>
      <span>Ice Age</span>
    </button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const isMobile = window.matchMedia('(pointer: coarse)').matches;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.6 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 4000);
camera.position.set(130, 75, 150);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 40;
controls.maxDistance = 520;
controls.maxPolarAngle = 1.48;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

/* ---------- lights ---------- */
const sunDir = new THREE.Vector3(0.45, 0.62, 0.3).normalize();
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x51634f, 0.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 1.3);
sun.position.copy(sunDir).multiplyScalar(420);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -200; sun.shadow.camera.right = 200;
sun.shadow.camera.top = 200; sun.shadow.camera.bottom = -200;
sun.shadow.camera.near = 100; sun.shadow.camera.far = 900;
sun.shadow.bias = -0.0005;
scene.add(sun);

/* ---------- helpers ---------- */
const _c = new THREE.Color();
function colorize(geo, hex, shade = 1){
  geo.deleteAttribute('uv');
  _c.set(hex).multiplyScalar(shade);
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){ arr[i * 3] = _c.r; arr[i * 3 + 1] = _c.g; arr[i * 3 + 2] = _c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}
const propMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1, metalness: 0 });
function place(geo, x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1){
  geo.applyMatrix4(new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)),
    new THREE.Vector3(sx, sy, sz)
  ));
  return geo;
}

/* ---------- sky dome ---------- */
const skyUni = {
  uTop: { value: new THREE.Color(0x2f7fd0) },
  uBot: { value: new THREE.Color(0xd8f0ff) },
  uSunDir: { value: sunDir },
  uSunI: { value: 1.3 },
  uFlash: { value: 0 }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1600, 32, 16),
  new THREE.ShaderMaterial({
    uniforms: skyUni, side: THREE.BackSide, depthWrite: false,
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 uTop, uBot, uSunDir;
      uniform float uSunI, uFlash;
      void main(){
        vec3 d = normalize(vDir);
        float h = max(d.y, 0.0);
        vec3 col = mix(uBot, uTop, pow(h, 0.55));
        float s = max(dot(d, uSunDir), 0.0);
        col += vec3(1.0, 0.9, 0.7) * pow(s, 700.0) * 1.6 * uSunI;
        col += vec3(1.0, 0.85, 0.6) * pow(s, 8.0) * 0.22 * uSunI;
        col += vec3(0.9, 0.95, 1.0) * uFlash;
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
scene.add(sky);

/* ---------- ocean ---------- */
const oceanUni = {
  uTime: { value: 0 },
  uAmp: { value: 0.5 },
  uSpd: { value: 0.9 },
  uShore: { value: 104.0 },
  uDeep: { value: new THREE.Color(0x0d6f92) },
  uShal: { value: new THREE.Color(0x36c2b8) },
  uSky: { value: skyUni.uBot.value },
  uSunDir: { value: sunDir },
  uSunI: { value: 1.3 },
  uFlash: { value: 0 },
  uFreezeR: { value: 1e6 },
  uRipples: { value: Array.from({ length: 8 }, () => new THREE.Vector4(0, 0, 0, 0)) }
};
const oceanGeo = new THREE.PlaneGeometry(3200, 3200, 1200, 1200);
oceanGeo.deleteAttribute('uv');
oceanGeo.deleteAttribute('normal');
oceanGeo.rotateX(-Math.PI / 2);
const ocean = new THREE.Mesh(oceanGeo, new THREE.ShaderMaterial({
  uniforms: oceanUni,
  vertexShader: `
    uniform float uTime, uAmp, uSpd, uFreezeR;
    uniform vec4 uRipples[8];
    varying vec3 vWorld;
    varying float vWave;
    varying float vFz;
    void main(){
      vec3 p = position;
      float t = uTime * uSpd;
      float w = sin(dot(p.xz, vec2(0.045, 0.025)) + t);
      w += sin(dot(p.xz, vec2(-0.065, 0.08)) + t * 1.35) * 0.55;
      w += sin(dot(p.xz, vec2(0.115, -0.095)) + t * 1.9) * 0.28;
      w += sin(dot(p.xz, vec2(0.155, 0.135)) + t * 2.6) * 0.14;
      w += sin(dot(p.xz, vec2(-0.2, 0.185)) + t * 3.3) * 0.08;
      w += sin(dot(p.xz, vec2(0.26, -0.235)) + t * 4.1) * 0.05;
      for (int i = 0; i < 8; i++){
        vec4 rp = uRipples[i];
        if (rp.z > 0.5){
          float dd = distance(p.xz, rp.xy);
          float rw = sin(dd * 0.35 - rp.w * 1.4) * exp(-abs(dd - rp.w) * 0.09) * max(0.0, 1.0 - rp.w * 0.016);
          p.y += rw * 2.4;
        }
      }
      vWave = w;
      float fz = smoothstep(uFreezeR + 10.0, uFreezeR - 10.0, length(p.xz));
      vFz = fz;
      w *= (1.0 - 0.97 * fz);
      p.y += w * uAmp;
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 uDeep, uShal, uSky, uSunDir;
    uniform float uSunI, uTime, uFlash, uShore;
    varying vec3 vWorld;
    varying float vWave;
    varying float vFz;
    void main(){
      float d = length(vWorld.xz);
      vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
      if (n.y < 0.0) n = -n;
      float ripA = 0.16 * smoothstep(900.0, 150.0, d);
      if (ripA > 0.001){
        vec2 rp = vWorld.xz;
        vec3 dn = vec3(
          sin(rp.x * 1.05 + uTime * 2.3) * cos(rp.y * 0.85 - uTime * 1.9) + 0.5 * sin(rp.x * 2.65 + uTime * 3.1),
          0.0,
          cos(rp.x * 0.75 - uTime * 2.1) * sin(rp.y * 1.15 + uTime * 1.7) + 0.5 * cos(rp.y * 2.35 + uTime * 2.7));
        n = normalize(n + dn * ripA);
      }
      vec3 V = normalize(cameraPosition - vWorld);
      float m = smoothstep(-1.2, 1.8, vWave);
      vec3 col = mix(uDeep, uShal, m * 0.55);
      float shore = smoothstep(uShore + 19.0, uShore - 12.0, d);
      col = mix(col, vec3(0.88, 0.82, 0.62), shore * 0.45);
      float fres = pow(1.0 - max(dot(n, V), 0.0), 3.0);
      col = mix(col, uSky, fres * 0.6);
      vec3 R = reflect(-V, n);
      col += vec3(1.0, 0.95, 0.8) * pow(max(dot(R, uSunDir), 0.0), 120.0) * uSunI * 0.9;
      float foam = smoothstep(uShore + 10.0, uShore - 8.0, d) * (0.3 + 0.3 * sin(uTime * 2.0 + d * 0.625 - vWave * 2.5));
      foam += smoothstep(1.45, 1.9, vWave) * 0.3;
      foam *= (1.0 - vFz);
      col = mix(col, vec3(1.0), clamp(foam, 0.0, 1.0) * 0.55);
      float crackle = smoothstep(0.75, 1.0, sin(d * 0.11) * sin(atan(vWorld.z, vWorld.x) * 7.0 + d * 0.05) * 0.5 + 0.5) * 0.08;
      col = mix(col, vec3(0.86, 0.93, 0.97), vFz * 0.92);
      col += vec3(1.0) * crackle * vFz;
      col = mix(col, uSky, smoothstep(800.0, 2200.0, d) * (1.0 - vFz));
      col += vec3(0.9, 0.95, 1.0) * uFlash * 0.6;
      gl_FragColor = vec4(col, 1.0);
    }`
}));
scene.add(ocean);

/* ---------- island (radius x4 = 104) ---------- */
function islandHeight(x, z){
  const r = Math.sqrt(x * x + z * z);
  const th = Math.atan2(z, x);
  const n = Math.sin(th * 3 + 1.7) * 0.5 + Math.sin(th * 6 + r * 0.125) * 0.25 + Math.sin(r * 0.225 + th * 2) * 0.2;
  const n2 = Math.sin(th * 12 + r * 0.575) * 0.15 + Math.sin(r * 0.675 - th * 5) * 0.12 + Math.sin(th * 27 + r * 0.325) * 0.06;
  let h = Math.max(0, 1 - Math.pow(r / 104, 1.8));
  h = Math.pow(h, 1.2) * 15 * (1 + 0.3 * n + 0.5 * n2 * (0.4 + 0.6 * THREE.MathUtils.smoothstep(r, 16, 56)));
  h += Math.sin(x * 0.35 + Math.sin(z * 0.225)) * Math.sin(z * 0.4) * 0.12 * THREE.MathUtils.smoothstep(h, 2, 8);
  const skirt = THREE.MathUtils.smoothstep(r, 96, 136);
  return THREE.MathUtils.lerp(h, -6, skirt);
}

/* current ground height (reflects babel ruins / terraform morph) */
let terraP = 0;
let baseHeightFn = islandHeight;
const cityBuildings = [], cityStacks = [];
let cityRoads = null;
function terraTargetHeight(x, z){
  const r = Math.hypot(x, z);
  if (r < 108) return 3;
  if (r < 148) return THREE.MathUtils.lerp(3, -6, (r - 108) / 40);
  return -6;
}
function groundHeight(x, z){
  const h0 = baseHeightFn(x, z);
  if (terraP <= 0) return h0;
  return h0 + (terraTargetHeight(x, z) - h0) * terraP;
}

const islandGeo = new THREE.PlaneGeometry(560, 560, 480, 480);
islandGeo.deleteAttribute('uv');
islandGeo.rotateX(-Math.PI / 2);
{
  const pos = islandGeo.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  const cWet = new THREE.Color(0xc9b075), cSand = new THREE.Color(0xead9a6);
  const cGrass = new THREE.Color(0x4f9449), cGrass2 = new THREE.Color(0x3d7c3e), cRock = new THREE.Color(0x8d8a80);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const y = islandHeight(x, z);
    pos.setY(i, y);
    c.copy(cWet);
    c.lerp(cSand, THREE.MathUtils.smoothstep(y, 0.2, 1.8));
    c.lerp(Math.random() < 0.5 ? cGrass : cGrass2, THREE.MathUtils.smoothstep(y, 2.4, 4.2));
    c.lerp(cRock, THREE.MathUtils.smoothstep(y, 9, 12.5));
    c.multiplyScalar(0.95 + Math.random() * 0.1);
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  islandGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  islandGeo.computeVertexNormals();
}
const island = new THREE.Mesh(islandGeo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1, metalness: 0 }));
island.receiveShadow = true;
scene.add(island);

/* ---------- palm trees ---------- */
const trees = [];
{
  const nTrees = 26;
  for (let i = 0; i < nTrees; i++){
    const a = (i / nTrees) * Math.PI * 2 + rand(-0.25, 0.25);
    const r = rand(24, 68);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x + 45, z - 35) < 22) continue; // keep village clear
    const h = rand(3.6, 5.8);
    const parts = [];
    const trunk = colorize(new THREE.CylinderGeometry(0.13, 0.26, h, 5), 0x8a6a45, rand(0.85, 1.1));
    place(trunk, 0, h / 2, 0, rand(-0.13, 0.13), 0, rand(-0.13, 0.13));
    parts.push(trunk);
    const cy = h * 0.98;
    for (let f = 0; f < 8; f++){
      const len = rand(2.2, 3.2);
      const frond = colorize(new THREE.ConeGeometry(0.32, len, 4), f % 2 ? 0x3f8f3f : 0x357f38, rand(0.85, 1.1));
      const fa = (f / 8) * Math.PI * 2 + rand(-0.15, 0.15);
      place(frond, Math.cos(fa) * 1.0, cy + rand(-0.1, 0.15), Math.sin(fa) * 1.0, 0, fa, Math.PI / 2.25, 1, 1, 0.3);
      parts.push(frond);
    }
    for (let k = 0; k < 3; k++){

const effects = [];

function makeFireball(pos, maxR, growT, color = 0xffcc66, additive = true){
  const fire = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false }));
  fire.position.copy(pos);
  scene.add(fire);
  return {
    t: 0,
    update(dt){
      this.t += dt;
      const g = this.t / growT;
      if (g < 1){
        fire.scale.setScalar(1 + (maxR - 1) * Math.pow(g, 0.6));
      } else {
        const f = 1 - Math.min(1, (this.t - growT) / 5);
        fire.material.opacity = 0.95 * f;
        fire.scale.setScalar(1 + (maxR - 1) * (1 + (this.t - growT) * 0.08));
        if (f <= 0){ scene.remove(fire); fire.geometry.dispose(); fire.material.dispose(); return false; }
      }
      return true;
    }
  };
}
function makeShockwave(y){
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.92, 1, 96),

      if (p >= 1){ scene.remove(ring); ring.geometry.dispose(); ring.material.dispose(); return false; }

  };

/* --- maelstrom --- */
function startMaelstrom(){
  const a = rand(0, Math.PI * 2);
  const epicenter = new THREE.Vector3(Math.cos(a) * 190, 0, Math.sin(a) * 190);
  const group = new THREE.Group();
  group.position.copy(epicenter);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(70, 64), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uT: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uT;
      varying vec2 vUv;
      void main(){
        vec2 q = vUv * 2.0 - 1.0;
        float r = length(q);
        float ang = atan(q.y, q.x);
        float sp = sin(ang * 3.0 - r * 18.0 + uT * 7.0);
        float foam = smoothstep(0.7, 0.95, sp) * smoothstep(1.0, 0.1, r);
        vec3 col = mix(vec3(0.02, 0.1, 0.16), vec3(0.1, 0.35, 0.4), smoothstep(0.6, 0.0, r));
        col = mix(col, vec3(0.9, 0.95, 1.0), foam);
        col = mix(col, vec3(0.0, 0.02, 0.04), smoothstep(0.45, 0.0, r) * 0.85);
        float alpha = smoothstep(1.0, 0.75, r);
        gl_FragColor = vec4(col, alpha);
      }`
  }));
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = 0.4;
  group.add(disc);
  const funnel = new THREE.Mesh(new THREE.CylinderGeometry(56, 8, 26, 32, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x0a2e3c, flatShading: true, roughness: 0.7, transparent: true, opacity: 0.85, side: THREE.DoubleSide }));
  funnel.position.y = -12;
  group.add(funnel);
  scene.add(group);
  effects.push({
    t: 0, dur: 30, group, disc,
    update(dt){
      this.t += dt;
      const inS = Math.min(1, this.t / 3), outS = Math.min(1, Math.max(0, (this.dur - this.t) / 5));
      const s = Math.min(inS, outS);
      group.scale.setScalar(s);
      group.rotation.y += dt * 2.2;
      disc.material.uniforms.uT.value += dt;
      return this.t < this.dur;
    },
    onEnd(){ scene.remove(group); }
  });
  disaster = { type: 'maelstrom', t: 0, dur: 30, epicenter, label: 'MAELSTORM', shock: 0 };
}

function updateUFO(d, dt){
  if (!d.saucer) return;
  const g = d.saucer, beam = d.beam;
  const groundY = groundHeight(g.position.x, g.position.z);
  const hoverY = groundY + 42 + Math.sin(elapsed * 1.3) * 1.5;
  d.phaseT += dt;
  d.epicenter.set(g.position.x, 0, g.position.z);
  d.lightMat.color.setHSL((elapsed * 0.6) % 1, 0.8, 0.6);
  g.rotation.y += dt * 0.8;

  if (d.phase === 'select'){
    beam.visible = false;
    if (!d.remaining.length){ d.phase = 'leave'; d.phaseT = 0; return; }
    if (d.phaseT > 0.5){
      let best = null, bd = 1e9;
      for (const r of d.remaining){
        const dx = r.obj.g.position.x - g.position.x, dz = r.obj.g.position.z - g.position.z;
        const dist = dx * dx + dz * dz;
        if (dist < bd){ bd = dist; best = r; }
      }
      d.target = best;
      d.phase = 'seek';
      d.phaseT = 0;
    }
  } else if (d.phase === 'seek'){
    const t = d.target.obj.g.position;
    _v.set(t.x - g.position.x, 0, t.z - g.position.z);
    const dist = _v.length();
    const step = 85 * dt;
    if (dist <= step || dist < 2){
      g.position.x = t.x; g.position.z = t.z;
      d.phase = 'beam'; d.phaseT = 0;
      beam.visible = true;
      sfxZap();
    } else {
      _v.normalize();
      g.position.x += _v.x * step;
      g.position.z += _v.z * step;
    }
  } else if (d.phase === 'beam'){
    const o = d.target.obj;
    o.g.position.y += 32 * dt;
    o.g.rotation.y += 6 * dt;
    if (o.g.position.y > g.position.y - 6){
      const arr = d.arrays[d.target.kind];
      arr.splice(arr.indexOf(o), 1);
      scene.remove(o.g);
      d.remaining.splice(d.remaining.indexOf(d.target), 1);
      d.target = null;
      beam.visible = false;
      d.phase = 'select'; d.phaseT = 0;
    }
  } else if (d.phase === 'leave'){
    beam.visible = false;
    g.position.y += 70 * dt;
    g.position.x += 45 * dt;
    d.leaveT += dt;
    if (d.leaveT > 6 || g.position.y > 600){
      scene.remove(g);
      scene.remove(beam);
      beam.geometry.dispose();
      beam.material.dispose();
      d.saucer = null;
      d.beam = null;
      disaster.dur = disaster.t;
      return;
    }
  }
  if (d.phase !== 'leave') g.position.y += (hoverY - g.position.y) * Math.min(1, dt * 2);

  if (beam.visible){
    beam.position.copy(g.position);
    beam.scale.set(1, Math.max(1, g.position.y - groundHeight(g.position.x, g.position.z)), 1);
    beam.rotation.y = elapsed * 3;
    beam.material.opacity = 0.3 + 0.18 * Math.sin(elapsed * 25);
  }
}

function updateBabel(d, dt){
  if (d.phase === 'done') return;
  d.phaseT += dt;
  if (d.phase === 'build'){
    d.towerH = Math.min(260, d.phaseT * 20);
    const want = Math.min(26, Math.floor(d.towerH / 10));
    while (d.tierIdx < want){
      const i = d.tierIdx++;
      const rr = Math.max(6, 16 - i * 0.42);
      const tier = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr + 1.2, 10, 8),
        new THREE.MeshStandardMaterial({ color: 0xb0a48c, flatShading: true, roughness: 1 }));

      trees.forEach(t => { t.m.position.y = effHeight(t.m.position.x, t.m.position.z, prog); });
      if (prog >= 1 && !d.flattenDone){
        d.flattenDone = true;

    for (const t of d.tumble){
      if (t.rest) continue;
      t.vy -= 90 * dt;
      t.m.position.x += t.vx * dt;
      t.m.position.z += t.vz * dt;
      t.m.position.y += t.vy * dt;
      t.m.rotation.x += t.avx * dt;
      t.m.rotation.z += t.avz * dt;
      const gy = effHeight(t.m.position.x, t.m.position.z, d.flattenP) + 2.5;

        d.hand = null;

        d.phase = 'done';
        disaster.dur = disaster.t;
        return;

    }

}
function updateRipples(dt){

}
const debris = [];

function makeSplash(x, z){
  addRipple(x, z);
  const n = 36;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3);
  const vel = new Float32Array(n * 3);

    const a = rand(0, Math.PI * 2), r0 = rand(0.3, 1);
    vel[i * 3] = Math.cos(a) * r0 * rand(4, 14);
    vel[i * 3 + 1] = rand(9, 22);
    vel[i * 3 + 2] = Math.sin(a) * r0 * rand(4, 14);
  }

  ring.rotation.x = -Math.PI / 2;

  scene.add(ring);
  const eff = { t: 0, update(dt){
    this.t += dt;
    const p = geo.attributes.position.array;

      vel[i * 3 + 1] -= 22 * dt;
      p[i * 3] += vel[i * 3] * dt;

      p[i * 3 + 2] += vel[i * 3 + 2] * dt;
    }

    ring.material.opacity = Math.max(0, 0.7 * (1 - this.t / 2.2));
    return this.t < 2.2;
  }, onEnd(){
    scene.remove(pts); geo.dispose(); mat.dispose();

  } };

}
function updateDebris(dt){
  for (let i = debris.length - 1; i >= 0; i--){
    const dc = debris[i];
    if (dc.restT > 0){
      dc.restT += dt;
      dc.m.scale.multiplyScalar(1 - 0.55 * dt);
      if (dc.restT > 1.6){ scene.remove(dc.m); dc.m.geometry.dispose(); dc.m.material.dispose(); debris.splice(i, 1); }
      continue;
    }
    dc.vy -= 26 * dt;
    dc.m.position.x += dc.vx * dt;
    dc.m.position.y += dc.vy * dt;
    dc.m.position.z += dc.vz * dt;
    dc.m.rotation.x += dc.spin * dt;
    dc.m.rotation.z += dc.spin * 0.7 * dt;
    const gh = groundHeight(dc.m.position.x, dc.m.position.z);
    if (dc.m.position.y < gh + 0.4){
      if (gh < 1.2 && Math.hypot(dc.m.position.x, dc.m.position.z) > 100){

        makeSplash(dc.m.position.x, dc.m.position.z);

      } else {

        dc.m.position.y = gh + 0.4;
      }
    } else if (dc.splashed){
      dc.m.position.y -= 1.4 * dt;
      if (dc.m.position.y < -5){ scene.remove(dc.m); dc.m.geometry.dispose(); dc.m.material.dispose(); debris.splice(i, 1); }
    }
  }
}

function updateGodzilla(d, dt){
  if (d.phase === 'done') return;
  d.phaseT += dt;
  const gz = d.gz, g = gz.g;
  d.epicenter.set(g.position.x, 0, g.position.z);
  gz.spineMat.emissiveIntensity = 0.35 + 0.15 * Math.sin(elapsed * 2.5);

  if (d.phase === 'walk' || d.phase === 'attack'){
    if (!d.target || !d.target.alive){
      let best = null, bd = 1e9;
      for (const t of d.targets){
        if (!t.alive) continue;
        const dist = Math.hypot(t.x - g.position.x, t.z - g.position.z);
        if (dist < bd){ bd = dist; best = t; }
      }
      d.target = best;
      if (!best){
        d.phase = 'exit';
        d.phaseT = 0;
        const l = Math.hypot(g.position.x, g.position.z) || 1;
        d.exitDir = { x: g.position.x / l, z: g.position.z / l };
        return;
      }
    }
  }
  if (d.phase === 'walk'){
    const t = d.target;
    const dx = t.x - g.position.x, dz = t.z - g.position.z;
    const dist = Math.hypot(dx, dz);
    g.rotation.y = Math.atan2(dx, dz);
    const reach = (t.r || 12) + 13;
    if (dist <= reach){
      d.phase = 'attack'; d.phaseT = 0; d.hit = false;
      sfxRoar();
      shakeAmp = Math.max(shakeAmp, 0.8);
    } else {
      const step = 16 * dt;
      g.position.x += (dx / dist) * step;
      g.position.z += (dz / dist) * step;
      d.walkT += dt;
      const s = Math.sin(d.walkT * 6);
      gz.legL.rotation.x = s * 0.55;
      gz.legR.rotation.x = -s * 0.55;
      if (s * d.lastS <= 0){ sfxStomp(); shakeAmp = Math.max(shakeAmp, 0.25); }
      d.lastS = s;
      g.position.y = Math.max(groundHeight(g.position.x, g.position.z), -4.5) + Math.abs(s) * 0.5;
    }
  } else if (d.phase === 'attack'){
    const t = d.target;
    g.rotation.y = Math.atan2(t.x - g.position.x, t.z - g.position.z);
    const lunge = Math.sin(Math.min(1, d.phaseT / 0.5) * Math.PI) * 3.5;
    const dx = t.x - g.position.x, dz = t.z - g.position.z;
    const dl = Math.hypot(dx, dz) || 1;
    g.position.x += (dx / dl) * lunge * dt * 6;
    g.position.z += (dz / dl) * lunge * dt * 6;
    g.rotation.x = -Math.sin(Math.min(1, d.phaseT / 0.5) * Math.PI) * 0.18;
    if (d.phaseT > 0.55 && !d.hit){ d.hit = true; destroyTarget(d.target); }
    if (d.phaseT > 1.2){ d.phase = 'walk'; d.phaseT = 0; d.target = null; }
  } else if (d.phase === 'exit'){
    g.position.x += d.exitDir.x * 15 * dt;
    g.position.z += d.exitDir.z * 15 * dt;
    d.walkT += dt;
    gz.legL.rotation.x = Math.sin(d.walkT * 6) * 0.55;
    gz.legR.rotation.x = -Math.sin(d.walkT * 6) * 0.55;
    g.position.y = Math.max(groundHeight(g.position.x, g.position.z), -6) + Math.abs(Math.sin(d.walkT * 6)) * 0.5;
    if (d.phaseT > 12){
      scene.remove(g);
      d.phase = 'done';
      disaster.dur = disaster.t;
      return;
    }
  }
}

function initSmoke(){
  if (smokePts) return;
  const N = 700;
  const pos = new Float32Array(N * 3);
  const emit = new Float32Array(N * 3);
  const seed = new Float32Array(N);
  for (let i = 0; i < N; i++){
    const s = STACK_POS[i % STACK_POS.length];
    emit[i * 3] = s[0]; emit[i * 3 + 1] = 33; emit[i * 3 + 2] = s[1];
    seed[i] = Math.random();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aEmit', new THREE.BufferAttribute(emit, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  smokeUni = { uTime: { value: 0 }, uOp: { value: 0 }, uWind: { value: 0 } };
  smokePts = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: smokeUni, transparent: true, depthWrite: false,
    vertexShader: `
      uniform float uTime, uWind;
      attribute vec3 aEmit;
      attribute float aSeed;
      varying float vA;
      void main(){
        float life = mod(uTime * (0.16 + aSeed * 0.14) + aSeed * 11.0, 1.0);
        vec3 p = aEmit;
        p.y += life * 60.0;
        p.x += life * life * (14.0 + uWind * 0.8) + sin(uTime * 1.2 + aSeed * 40.0) * (1.5 + life * 7.0);
        p.z += cos(uTime * 0.9 + aSeed * 31.0) * (1.0 + life * 5.0);
        vA = smoothstep(0.0, 0.08, life) * (1.0 - life) * 0.45;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = (40.0 + life * 140.0) / -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float uOp;
      varying float vA;
      void main(){
        if (uOp < 0.01) discard;
        vec2 uv = gl_PointCoord - 0.5;
        float d = smoothstep(0.5, 0.05, length(uv));
        gl_FragColor = vec4(0.58, 0.55, 0.5, d * vA * uOp);
      }`
  }));
  smokePts.frustumCulled = false;
  scene.add(smokePts);
}

    if (d.phaseT > 8){
      d.phase = 'done';
      terraDone = true;
      Object.assign(W.sunny, W.smog);
      disaster.dur = disaster.t;
      return;
    }
  }
}

/* ---------- weather state machine ---------- */
const W = {
  sunny:    { skyT: 0x2f7fd0, skyB: 0xd8f0ff, fog: 0xbfe0f5, fogD: 0.00018, sunI: 1.3, hemiI: 0.8, amp: 0.5, spd: 0.9, deep: 0x0d6f92, shal: 0x36c2b8, rain: 0, wind: 6,  cloudOp: 0.92, cloudY: 0,  snow: 0, label: 'Sunny · 29°C' },
  rain:     { skyT: 0x4a6a86, skyB: 0x9fb8c8, fog: 0x8fa8b8, fogD: 0.0005, sunI: 0.45, hemiI: 0.55, amp: 1.1, spd: 1.3, deep: 0x11566e, shal: 0x2c8f8f, rain: 0.55, wind: 16, cloudOp: 0.97, cloudY: 5, snow: 0, label: 'Rain · 25°C' },
  storm:    { skyT: 0x1d2733, skyB: 0x50617a, fog: 0x4a5568, fogD: 0.0007, sunI: 0.18, hemiI: 0.4, amp: 1.8, spd: 1.8, deep: 0x0d3d52, shal: 0x24666e, rain: 1.0, wind: 30, cloudOp: 1.0, cloudY: 9, snow: 0, label: 'Thunderstorm · 23°C' },
  hurricane:{ skyT: 0x141a22, skyB: 0x3c4a5c, fog: 0x3a4658, fogD: 0.0009, sunI: 0.1, hemiI: 0.34, amp: 3.0, spd: 2.4, deep: 0x0a2f42, shal: 0x1d5666, rain: 1.0, wind: 90, cloudOp: 1.0, cloudY: 12, snow: 0, label: 'Hurricane · 22°C' },
  smog:     { skyT: 0x4a4038, skyB: 0x9a8f7a, fog: 0x8a7f6a, fogD: 0.0014, sunI: 0.25, hemiI: 0.45, amp: 0.8, spd: 1.2, deep: 0x3a5a52, shal: 0x5a7a66, rain: 0.35, wind: 12, cloudOp: 1.0, cloudY: 6, snow: 0, label: 'Smog · 24°C' },
  ice:      { skyT: 0x7a9ab8, skyB: 0xdce9f2, fog: 0xcfe0ea, fogD: 0.0008, sunI: 0.55, hemiI: 0.6, amp: 0.1, spd: 0.5, deep: 0x3a6a80, shal: 0x7aa8b8, rain: 0, wind: 8, cloudOp: 0.95, cloudY: 4, snow: 1, label: 'Deep Freeze · -12°C' }
};
let target = W.sunny, mode = 'sunny';
const curDeep = new THREE.Color(W.sunny.deep), curShal = new THREE.Color(W.sunny.shal);
const curFog = new THREE.Color(W.sunny.fog), curSkyT = new THREE.Color(W.sunny.skyT), curSkyB = new THREE.Color(W.sunny.skyB);
const cur = { ...W.sunny };
scene.fog = new THREE.FogExp2(curFog.getHex(), W.sunny.fogD);

const condEl = document.getElementById('cond'), windEl = document.getElementById('wind');
const btns = [...document.querySelectorAll('.wbtn')];
btns.forEach(b => {
  if (b.dataset.w) b.addEventListener('click', () => {
    mode = b.dataset.w;
    target = W[mode];
    btns.forEach(x => { if (x.dataset.w) x.classList.toggle('active', x === b); });
    nextBolt = 1.5;
  });
  else b.addEventListener('click', () => {
    if (disaster) return;
    const d = b.dataset.d;
    if (d === 'terraform' && terraDone) return;
    if (d === 'maelstrom') startMaelstrom();
    else if (d === 'nuke') startNuke();
    else if (d === 'meteor') startMeteor();
    else if (d === 'ufo') startUFO();
    else if (d === 'babel') startBabel();
    else if (d === 'terraform') startTerraform();
    else if (d === 'godzilla') startGodzilla();
    else if (d === 'ice') startIceAge();
    b.classList.add('active');
  });
});

/* ---------- audio ---------- */
let audioCtx = null, masterGain = null, rainGain = null, windGain = null, muted = false;
function initAudio(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = muted ? 0 : 0.6;
  masterGain.connect(audioCtx.destination);
  const len = audioCtx.sampleRate * 2;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const rainSrc = audioCtx.createBufferSource();
  rainSrc.buffer = buf; rainSrc.loop = true;
  const rFilter = audioCtx.createBiquadFilter();
  rFilter.type = 'highpass'; rFilter.frequency.value = 900;
  rainGain = audioCtx.createGain(); rainGain.gain.value = 0;
  rainSrc.connect(rFilter); rFilter.connect(rainGain); rainGain.connect(masterGain);
  rainSrc.start();
  const windSrc = audioCtx.createBufferSource();
  windSrc.buffer = buf; windSrc.loop = true;
  const wFilter = audioCtx.createBiquadFilter();
  wFilter.type = 'lowpass'; wFilter.frequency.value = 350;
  windGain = audioCtx.createGain(); windGain.gain.value = 0.04;
  windSrc.connect(wFilter); wFilter.connect(windGain); windGain.connect(masterGain);
  windSrc.start();
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.2;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = 0.02;
  lfo.connect(lfoG); lfoG.connect(windGain.gain);
  lfo.start();
}
function playNoiseBurst(dur, f0, f1, gain){
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++){
    const p = i / d.length;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - p, 2.2);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.setValueAtTime(f0, t);
  f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start();
}
const sfxThunder = () => playNoiseBurst(2.2, 400, 60, 0.9);
const sfxBoom = () => playNoiseBurst(4.5, 220, 30, 1.4);
const sfxZap = () => playNoiseBurst(0.8, 2600, 300, 0.5);
function sfxRoar(){
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(70, t);
  o.frequency.exponentialRampToValueAtTime(38, t + 1.3);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 300;
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 1.4);
  playNoiseBurst(1.2, 200, 50, 0.6);
}
const sfxStomp = () => playNoiseBurst(0.25, 110, 45, 0.45);
const muteBtn = document.getElementById('mute');
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
muteBtn.innerHTML = ICON_ON;
muteBtn.addEventListener('click', () => {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  muted = !muted;
  muteBtn.innerHTML = muted ? ICON_OFF : ICON_ON;
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.6;
});

/* ---------- animation ---------- */
const clock = new THREE.Clock();
let elapsed = 0;
window.__dbg = () => disaster ? { type: disaster.type, phase: disaster.phase, t: +disaster.t.toFixed(1), phaseT: +disaster.phaseT.toFixed(1), dur: disaster.dur, tiers: disaster.tiers ? disaster.tiers.length : -1 } : null;
const hint = document.getElementById('hint');
setTimeout(() => { hint.style.opacity = '0'; }, 6000);
const _v = new THREE.Vector3();

function moveWanderer(o, dt, baseY, speedMult, bounds){
  const dx = o.tx - o.g.position.x, dz = o.tz - o.g.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 1){
    const a = rand(0, Math.PI * 2), r = rand(2, bounds);
    o.tx = o.g.position.x + Math.cos(a) * r;
    o.tz = o.g.position.z + Math.sin(a) * r;
  } else {
    const sp = o.speed * speedMult;
    o.g.position.x += (dx / dist) * sp * dt;
    o.g.position.z += (dz / dist) * sp * dt;
    o.g.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
  }
  const maxR = terraP > 0.5 ? 140 : 96;
  const rr = Math.hypot(o.g.position.x, o.g.position.z);
  if (rr > maxR){ const s = maxR / rr; o.g.position.x *= s; o.g.position.z *= s; }
  o.g.position.y = groundHeight(o.g.position.x, o.g.position.z) + Math.abs(Math.sin(elapsed * 6 * speedMult + o.phase)) * 0.06 * speedMult;
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const k = 1 - Math.exp(-dt * 1.1);

  // --- weather interpolation ---
  cur.rain += (target.rain - cur.rain) * k;
  cur.sunI += (target.sunI - cur.sunI) * k;
  cur.hemiI += (target.hemiI - cur.hemiI) * k;
  cur.amp += (target.amp - cur.amp) * k;
  cur.spd += (target.spd - cur.spd) * k;
  cur.wind += (target.wind - cur.wind) * k;
  cur.fogD += (target.fogD - cur.fogD) * k;
  cur.cloudY += (target.cloudY - cur.cloudY) * k;
  curFog.lerp(new THREE.Color(target.fog), k);
  curSkyT.lerp(new THREE.Color(target.skyT), k);
  curSkyB.lerp(new THREE.Color(target.skyB), k);
  curDeep.lerp(new THREE.Color(target.deep), k);
  curShal.lerp(new THREE.Color(target.shal), k);

  // --- disaster update ---
  let shock = 0, panicEpic = null;
  if (disaster){
    disaster.t += dt;
    disaster.shock = Math.max(0, disaster.shock - dt / 4);
    shock = disaster.shock;
    panicEpic = ((disaster.type === 'babel' && disaster.phase === 'build') || disaster.type === 'terraform') ? null : disaster.epicenter;
    if (disaster.type === 'meteor' && !disaster.impacted){
      const p = Math.min(1, disaster.t / 4.5);
      disaster.meteor.position.lerpVectors(disaster.start, disaster.impact, p);
      if (p >= 1){ disaster.impacted = true; meteorImpact(disaster); }
    }
    if (disaster.type === 'ufo') updateUFO(disaster, dt);
    if (disaster.type === 'babel') updateBabel(disaster, dt);
    if (disaster.type === 'terraform') updateTerraform(disaster, dt);
    if (disaster.type === 'godzilla') updateGodzilla(disaster, dt);
    if (disaster.type === 'ice') updateIceAge(disaster, dt);
    updateRipples(dt);
    updateDebris(dt);
    if (disaster.t > disaster.dur){
      const btn = document.querySelector(`[data-d="${disaster.type}"]`);
      if (btn) btn.classList.remove('active');
      disaster = null;
    }
  }
  for (let i = effects.length - 1; i >= 0; i--){
    if (!effects[i].update(dt)){
      if (effects[i].onEnd) effects[i].onEnd();
      effects.splice(i, 1);
    }
  }

  // --- apply weather visuals ---
  const windExtra = shock * 70;
  sun.intensity = cur.sunI;
  skyUni.uSunI.value = cur.sunI;
  hemi.intensity = cur.hemiI;
  scene.fog.color.copy(curFog);
  scene.fog.density = cur.fogD;
  skyUni.uTop.value.copy(curSkyT);
  skyUni.uBot.value.copy(curSkyB);
  oceanUni.uDeep.value.copy(curDeep);
  oceanUni.uShal.value.copy(curShal);
  oceanUni.uSky.value.copy(curSkyB);
  oceanUni.uAmp.value = cur.amp + shock * 2;
  oceanUni.uSpd.value = cur.spd + shock;
  oceanUni.uTime.value = elapsed;
  skyUni.uFlash.value = flashV * 0.7;
  oceanUni.uFlash.value = flashV * 0.5;
  flashV = Math.max(0, flashV - dt * 3.5);

  // rain
  rainUni.uTime.value = elapsed;
  rainUni.uOpacity.value = cur.rain;
  rainUni.uWind.value = Math.min((cur.wind + windExtra) / 160, 1);
  if (Math.random() < 0.02){
    const p = rainGeo.attributes.position.array;
    for (let i = 0; i < 40; i++){
      const idx = Math.floor(Math.random() * RAIN_N) * 3;
      p[idx] = camera.position.x + rand(-160, 160);
      p[idx + 2] = camera.position.z + rand(-160, 160);
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  // clouds
  cloudMat.opacity = cur.cloudOp;
  cloudMat.color.setRGB(1 - 0.3 * smogT, 1 - 0.32 * smogT, 1 - 0.36 * smogT);
  const drift = 4.0 + (cur.wind + windExtra) * 0.08;
  cloudGroup.children.forEach((c, i) => {
    if (stormRings.includes(c)) return;
    c.position.x += drift * dt * (i % 2 ? 1 : -1);
    if (c.position.x > 460) c.position.x = -460;
    if (c.position.x < -460) c.position.x = 460;
    c.position.y += (50 + cur.cloudY - c.position.y) * k;
  });
  const hurricaneOn = mode === 'hurricane';
  stormRings.forEach((ring, ri) => {
    ring.userData.vis = THREE.MathUtils.clamp(ring.userData.vis + (hurricaneOn ? dt * 0.4 : -dt * 0.4), 0, 1);
    ring.visible = ring.userData.vis > 0.01;
    ring.scale.setScalar(0.75 + 0.25 * ring.userData.vis);
    ring.rotation.y += dt * (0.05 + ri * 0.02) * (0.5 + (cur.wind + windExtra) / 60);
  });

  // inhabitants
  const frozen = frozenAll;

  // palms sway / bend with wind + shockwaves
  const windN = frozen ? 0 : Math.min(1, (cur.wind + windExtra) / 90);
  if (treesFallen){
    trees.forEach(t => { t.m.rotation.z = t.fallenDir * 1.35; t.m.rotation.x = 0.12; });
  } else trees.forEach(t => {
    t.m.rotation.z = Math.sin(elapsed * (1.2 + windN * 3) + t.phase) * (0.05 + windN * 0.25) - windN * 0.55;
    t.m.rotation.x = Math.cos(elapsed * (1.0 + windN * 2.5) + t.phase) * (0.03 + windN * 0.12);
  });

  // inhabitants
  const babelBuild = !frozen && disaster && disaster.type === 'babel' && disaster.phase === 'build';
  const terraWork = !frozen && disaster && disaster.type === 'terraform' && (disaster.phase === 'reclaim' || disaster.phase === 'construct');
  const panicMult = panicEpic ? 4 : 1;
  const beamed = (!frozen && disaster && disaster.type === 'ufo' && disaster.phase === 'beam' && disaster.target) ? disaster.target.obj : null;
  if (!frozen) villagers.forEach(v => {
    if (v === beamed) return;
    if (babelBuild){ v.tx = v.gx; v.tz = v.gz; moveWanderer(v, dt, 0, 2.5, 6); return; }
    if (terraWork){ v.tx = v.gx; v.tz = v.gz; moveWanderer(v, dt, 0, 2.2, 40); return; }
    if (panicEpic){
      _v.subVectors(v.g.position, panicEpic); _v.y = 0;
      if (_v.lengthSq() > 1){ _v.normalize().multiplyScalar(50); v.tx = v.g.position.x + _v.x; v.tz = v.g.position.z + _v.z; }
    }
    moveWanderer(v, dt, 0, panicMult, panicEpic ? 60 : 14);
  });
  if (!frozen) animals.forEach(a => {
    if (a === beamed) return;
    if (babelBuild){ a.tx = a.gx; a.tz = a.gz; moveWanderer(a, dt, 0, 2.5, 8); return; }
    if (terraWork){ a.tx = a.gx; a.tz = a.gz; moveWanderer(a, dt, 0, 2.2, 50); return; }
    if (panicEpic){
      _v.subVectors(a.g.position, panicEpic); _v.y = 0;
      if (_v.lengthSq() > 1){ _v.normalize().multiplyScalar(80); a.tx = a.g.position.x + _v.x; a.tz = a.g.position.z + _v.z; }
    }
    moveWanderer(a, dt, 0, panicMult, panicEpic ? 90 : 30);
  });
  if (!frozen) birds.forEach(b => {
    if (b === beamed) return;
    const spd = b.spd * (panicEpic ? 2.5 : 1);
    b.ang += spd * dt;
    b.g.position.set(Math.cos(b.ang) * b.rad, b.h + Math.sin(elapsed * 0.7 + b.flap) * 2, Math.sin(b.ang) * b.rad);
    b.g.rotation.y = -b.ang;
    b.g.children[0].rotation.y = Math.sin(elapsed * 10 + b.flap) * 0.4;
  });
  // lightning
  const stormy = mode === 'storm' ? 1 : (hurricaneOn ? 1.6 : 0);
  if (stormy > 0){
    boltTimer += dt;
    if (boltTimer > nextBolt){
      boltTimer = 0;
      nextBolt = rand(2.5, 6) / stormy;
      spawnBolt();
    }
  }
  if (boltMesh && boltLife > 0){
    boltLife -= dt;
    boltMat.opacity = Math.max(0, boltLife * (0.5 + 0.5 * Math.sin(elapsed * 60)));
    if (boltLife <= 0) boltMat.opacity = 0;
  }

  // camera shake
  if (shakeAmp > 0.001){
    controls.target.x += rand(-shakeAmp, shakeAmp);
    controls.target.y += rand(-shakeAmp, shakeAmp);
    shakeAmp *= Math.exp(-dt * 1.4);
  }

  // audio
  if (rainGain){
    rainGain.gain.value = cur.rain * 0.5;
    windGain.gain.value = 0.02 + Math.min(1, (cur.wind + windExtra) / 90) * 0.25;
  }
  if (smokeUni){
    smokeUni.uTime.value = elapsed;
    smokeUni.uWind.value = cur.wind;
  }
  snowUni.uTime.value = elapsed;
  snowUni.uOp.value = (cur.snow || 0) * (0.75 + 0.25 * Math.sin(elapsed * 0.4));

  // HUD
  condEl.textContent = disaster ? disaster.label : target.label;
  windEl.textContent = 'Wind ' + Math.round(cur.wind + windExtra) + ' kt';

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
