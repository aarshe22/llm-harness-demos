<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Voxel Garden of the Pagoda</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;font-family:'Consolas','Courier New',monospace;}
  canvas{display:block;}
  #hud{
    position:fixed;top:12px;left:12px;z-index:10;color:#eafff2;
    background:linear-gradient(180deg,rgba(10,30,25,.85),rgba(10,30,25,.55));
    border:1px solid rgba(120,255,190,.35);border-radius:10px;padding:10px 14px;
    box-shadow:0 0 24px rgba(0,0,0,.6);max-width:330px;pointer-events:none;
  }
  #hud #title{font-size:15px;letter-spacing:2px;color:#ffd9e8;text-shadow:0 0 8px rgba(255,120,170,.6);margin-bottom:6px;}
  #hud .row{font-size:11px;color:#bfeedd;line-height:1.55;}
  #hud .key{color:#ffe28a;}
  #hud #stats{margin-top:6px;font-size:10px;color:#8fd8ff;}
  #strip{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,rgba(12,14,22,.92),rgba(24,10,10,.88));
    border:1px solid rgba(255,90,90,.45);border-radius:14px;padding:10px 16px;
    box-shadow:0 0 30px rgba(0,0,0,.75), inset 0 0 18px rgba(255,60,60,.08);
  }
  #stripLabel{font-size:12px;letter-spacing:3px;color:#ff8d8d;text-shadow:0 0 10px rgba(255,40,40,.7);padding-right:6px;border-right:1px solid rgba(255,120,120,.3);}
  .dbtn{
    font-family:inherit;font-size:12px;font-weight:bold;letter-spacing:1px;
    padding:9px 12px;border-radius:8px;cursor:pointer;color:#fff;
    background:#241a1a;border:1px solid;transition:all .15s;
  }
  .dbtn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.6);}
  .dbtn.armed{animation:pulse .7s infinite alternate;}
  .dbtn.disabled{opacity:.35;cursor:not-allowed;}
  .dbtn[data-t="eq"]    {border-color:#ff9a3c;color:#ffcf9a;background:linear-gradient(180deg,#3a2410,#241408);}
  .dbtn[data-t="meteor"]{border-color:#ff4646;color:#ffc2c2;background:linear-gradient(180deg,#3a1010,#220808);}
  .dbtn[data-t="tsunami"]{border-color:#3ec8ff;color:#c2ecff;background:linear-gradient(180deg,#0e2a3a,#081822);}
  .dbtn[data-t="nuke"]  {border-color:#c6ff3e;color:#ecffc2;background:linear-gradient(180deg,#2a3a0e,#182208);}
  #reset{border-color:#8fe8b8;color:#c9ffdf;background:linear-gradient(180deg,#10331f,#081810);}
  #status{font-size:11px;color:#ffe28a;min-width:220px;max-width:320px;text-align:center;}
  @keyframes pulse{from{filter:brightness(1);}to{filter:brightness(1.8);}}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;}
</style>
</head>
<body>
<div id="hud">
  <div id="title">THE VOXEL GARDEN OF THE PAGODA</div>
  <div class="row">
    <span class="key">Z / X</span> zoom in / out &nbsp; <span class="key">Q / A</span> up / down<br>
    <span class="key">ARROWS</span> navigate &nbsp; <span class="key">DRAG</span> look around<br>
    <span class="key">DISASTER BAR</span> click a button, then click the world
  </div>
  <div id="stats"></div>
</div>
<div id="strip">
  <div id="stripLabel">DISASTER CONTROL</div>
  <button class="dbtn" data-t="eq">EARTHQUAKE</button>
  <button class="dbtn" data-t="meteor">METEOR STRIKE</button>
  <button class="dbtn" data-t="tsunami">TSUNAMI</button>
  <button class="dbtn" data-t="nuke">25KT NUCLEAR AIRBURST</button>
  <button class="dbtn" id="reset">REBUILD WORLD</button>
  <div id="status"></div>
</div>
<div id="flash"></div>
<script src="three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
