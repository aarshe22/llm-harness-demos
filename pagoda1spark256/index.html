<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Pagoda Garden</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2a06b; }
  #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #fff; font-family: monospace; font-size: 14px; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="loader">LOADING GARDEN…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5a86a);
scene.fog = new THREE.Fog(0xf5a86a, 70, 210);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 700);
camera.position.set(27, 19, 31);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 7, 1);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 12;
controls.maxDistance = 95;
controls.enableDamping = true;
controls.dampingFactor = 0.06;

// ---------- lighting (warm sunset) ----------
const hemi = new THREE.HemisphereLight(0xffc48a, 0x6b4a33, 0.9);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xffd9b0, 0.28);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffb066, 2.6);
sun.position.set(-52, 44, -68);
sun.target.position.set(4, 4, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -42;
sun.shadow.camera.right = 42;
sun.shadow.camera.top = 42;
sun.shadow.camera.bottom = -42;
sun.shadow.camera.far = 220;
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

// low sun disc
const sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(16, 32),
  new THREE.MeshBasicMaterial({ color: 0xffd9a0, fog: false })
);
sunDisc.position.set(-120, 36, -175);
sunDisc.lookAt(0, 10, 0);
scene.add(sunDisc);

// ---------- helpers ----------
const BOX = new THREE.BoxGeometry(1, 1, 1);
const rnd = (a, b) => a + Math.random() * (b - a);

const MAT = {
  grass:      new THREE.MeshStandardMaterial({ color: 0x5f9a3d, roughness: 1 }),
  grass2:     new THREE.MeshStandardMaterial({ color: 0x71a94a, roughness: 1 }),
  dirt:       new THREE.MeshStandardMaterial({ color: 0x6e4a2a, roughness: 1 }),
  rock:       new THREE.MeshStandardMaterial({ color: 0x7d7468, roughness: 1 }),
  rockDark:   new THREE.MeshStandardMaterial({ color: 0x5d564e, roughness: 1 }),
  stone:      new THREE.MeshStandardMaterial({ color: 0x9a948b, roughness: 1 }),
  stoneDark:  new THREE.MeshStandardMaterial({ color: 0x6f6a63, roughness: 1 }),
  sand:       new THREE.MeshStandardMaterial({ color: 0xd9c27e, roughness: 1 }),
  water:      new THREE.MeshStandardMaterial({ color: 0x3ea6c9, roughness: 0.15, metalness: 0.35 }),
  plaster:    new THREE.MeshStandardMaterial({ color: 0xece2cf, roughness: 1 }),
  plaster2:   new THREE.MeshStandardMaterial({ color: 0xd8cbb2, roughness: 1 }),
  red:        new THREE.MeshStandardMaterial({ color: 0xb8352c, roughness: 0.85 }),
  redBright:  new THREE.MeshStandardMaterial({ color: 0xcf4433, roughness: 0.85 }),
  roof:       new THREE.MeshStandardMaterial({ color: 0x272c3d, roughness: 0.75 }),
  roof2:      new THREE.MeshStandardMaterial({ color: 0x333a52, roughness: 0.75 }),
  wood:       new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 1 }),
  woodDark:   new THREE.MeshStandardMaterial({ color: 0x54371f, roughness: 1 }),
  trunk:      new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 1 }),
  leafPink:   new THREE.MeshStandardMaterial({ color: 0xf2a7c3, roughness: 1 }),
  leafPink2:  new THREE.MeshStandardMaterial({ color: 0xf8c3d6, roughness: 1 }),
  leafPink3:  new THREE.MeshStandardMaterial({ color: 0xe88fb4, roughness: 1 }),
  gold:       new THREE.MeshStandardMaterial({ color: 0xd8a53c, roughness: 0.4, metalness: 0.55 }),
  lantern:    new THREE.MeshStandardMaterial({ color: 0xffe3ac, emissive: 0xffb45c, emissiveIntensity: 1.4, roughness: 1 }),
};

function addBox(parent, mat, x, y, z, w, h, d, cast = true) {
  const m = new THREE.Mesh(BOX, mat);
  m.scale.set(w, h, d);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ---------- island ----------
const G = 4.6; // grass top height
addBox(scene, MAT.dirt, 0, G - 2.2, 2, 34.5, 2.4, 30.5, false);   // lower rock slab
addBox(scene, MAT.grass, 0, G - 0.8, 2, 31.5, 1.6, 27.5, false);   // grass plateau

const inPond = (x, z) => { const dx = x + 10.5, dz = z - 4.5; return dx * dx + dz * dz < 33.6; };
const inBridge = (x, z) => (x > -16.2 && x < -4.8 && z > -2 && z < 11);

// scattered grass tufts
for (let i = 0; i < 70; i++) {
  const x = rnd(-15.5, 15.5), z = rnd(-11, 15.5);
  if (inPond(x + 0.5, z + 0.5) || inBridge(x, z)) continue;
  if (Math.abs(x) < 7 && z > -12.5 && z < 1.5) continue;            // pagoda footprint
  if (z > 12 && Math.abs(x) < 4.5) continue;                        // torii footprint
  const h = rnd(0.45, 0.8);
  addBox(scene, Math.random() < 0.6 ? MAT.grass : MAT.grass2, x, G + h / 2 - 0.08, z, rnd(0.8, 1.4), h, rnd(0.8, 1.4), false);
}

// stone path (torii -> bridge, and -> pagoda entrance)
{
  const pts = [[11, 13], [9, 11.5], [7, 10], [5, 8.5], [3, 7], [1, 6.6], [-1, 5.9], [-3, 5.2], [-5, 4.8], [-6.6, 4.5],
               [3, 7], [2, 4.5], [1, 1.5], [0.5, -0.6]];
  const stones = [];
  for (let i = 0; i < pts.length; i++) { stones.push(pts[i]); if (pts[i + 1]) stones.push([(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2]); }
  const seen = new Set();
  for (const [x, z] of stones) {
    const k = x.toFixed(1) + ',' + z.toFixed(1);
    if (seen.has(k)) continue; seen.add(k);
    if (inPond(x, z) || inBridge(x, z)) continue;
    addBox(scene, Math.random() < 0.5 ? MAT.stone : MAT.stoneDark, x + rnd(-0.25, 0.25), G + 0.06, z + rnd(-0.25, 0.25), rnd(1.3, 1.9), 0.14, rnd(1.3, 1.9), false);
  }
}

// ---------- pond ----------
{
  const step = 1.15;
  for (let x = -16; x < -5; x += step) {
    for (let z = -1; z < 10; z += step) {
      const dx = x + 0.5 + 10.5, dz = z + 0.5 - 4.5;
      if (dx * dx + dz * dz > 30) continue;
      const w = step + 0.12, d = step + 0.12;
      addBox(scene, MAT.water, x + step / 2, G - 0.09, z + step / 2, w, 0.3, d, false);
    }
  }
}

// ---------- stone lanterns ----------
function lanternAt(x, z) {
  const g = new THREE.Group();
  addBox(g, MAT.stone, 0, 0.18, 0, 0.75, 0.36, 0.75);
  addBox(g, MAT.stone, 0, 0.75, 0, 0.42, 0.8, 0.42);
  addBox(g, MAT.stoneDark, 0, 1.16, 0, 0.85, 0.2, 0.85);
  addBox(g, MAT.lantern, 0, 1.58, 0, 0.55, 0.62, 0.55);
  addBox(g, MAT.roof, 0, 1.98, 0, 0.95, 0.16, 0.95);
  addBox(g, MAT.stone, 0, 2.16, 0, 0.18, 0.2, 0.18);
  g.position.set(x, G, z);
  scene.add(g);
  const light = new THREE.PointLight(0xffb45c, 14, 11, 2);
  light.position.set(x, G + 1.6, z);
  scene.add(light);
}
lanternAt(6.2, 7.6);
lanternAt(-6.6, 12.4);
lanternAt(9.5, -3.5);

// ---------- cherry trees ----------
function blob(g, ox, oy, oz, r, count) {
  for (let i = 0; i < count; i++) {
    const s = rnd(0.75, 1.15);
    addBox(g, Math.random() < 0.45 ? MAT.leafPink : (Math.random() < 0.55 ? MAT.leafPink2 : MAT.leafPink3),
      ox + rnd(-r, r), oy + rnd(-r * 0.7, r * 0.7), oz + rnd(-r, r), s, s, s);
  }
}
function treeAt(x, z, s = 1) {
  const g = new THREE.Group();
  addBox(g, MAT.trunk, 0, 1.7 * s, 0, 0.55, 3.4 * s, 0.55);
  blob(g, 0, 4.3 * s, 0, 2.2, 26);
  blob(g, 1.5, 3.5 * s, 0.7, 1.5, 16);
  blob(g, -1.3, 3.7 * s, -0.9, 1.4, 14);
  blob(g, 0, 5.7 * s, 0, 1.3, 10);
  g.position.set(x, G, z);
  scene.add(g);
}
treeAt(13.5, -4, 0.95);
treeAt(-13.5, 11.5, 1.05);
treeAt(13.5, 11.5, 0.9);

// ---------- rocks & bushes ----------
function rocksAt(x, z, n, r) {
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) {
    const s = rnd(0.5, 1.0);
    addBox(g, Math.random() < 0.5 ? MAT.rock : MAT.rockDark, rnd(-r, r), s / 2, rnd(-r, r), s, s * rnd(0.6, 0.9), s);
  }
  g.position.set(x, G, z);
  scene.add(g);
}
rocksAt(13.2, 3.8, 5, 1.7);
rocksAt(-12, 13, 4, 1.2);
rocksAt(1, -11.5, 4, 1.5);

// ---------- wooden bridge ----------
{
  const x0 = -15.5, x1 = -5.5, n = 12, L = 10, A = 1.4, cx = -10.5;
  const step = L / n;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * step + step / 2;
    const u = (x - cx) / (L / 2);
    const yb = G + 0.1 + A * (1 - u * u); // deck bottom
    addBox(scene, MAT.wood, x, yb + 0.14, 3.5, step + 0.04, 0.28, 2.1);
    addBox(scene, MAT.wood, x, yb + 0.14, 5.5, step + 0.04, 0.28, 2.1);
    for (const zSide of [2.55, 6.45]) {
      const h = 0.85 - Math.max(0, u) * 0; // constant post height
      addBox(scene, MAT.woodDark, x - step / 2 + 0.1, yb + 0.14 + h / 2, zSide, 0.16, h, 0.16);
      addBox(scene, MAT.woodDark, x + step / 2 - 0.1, yb + 0.14 + h / 2, zSide, 0.16, h, 0.16);
      addBox(scene, MAT.woodDark, x, yb + 0.14 + h + 0.07, zSide, step + 0.04, 0.14, 0.2);
    }
  }
}

// ---------- torii gate ----------
{
  const g = new THREE.Group();
  for (const px of [-2.6, 2.6]) {
    addBox(g, MAT.redBright, px, 3.4, 0, 0.48, 6.8, 0.48);
    addBox(g, MAT.redBright, px, 3.4, 1.2, 0.48, 6.8, 0.48);
  }
  addBox(g, MAT.woodDark, 0, 5.15, 0.6, 7.2, 0.42, 0.55);          // lower crossbeam
  addBox(g, MAT.redBright, 0, 6.35, 0.6, 7.8, 0.45, 0.75);          // top beam
  addBox(g, MAT.roof, -3.95, 6.35, 0.6, 0.5, 0.55, 0.85);
  addBox(g, MAT.roof, 3.95, 6.35, 0.6, 0.5, 0.55, 0.85);
  addBox(g, MAT.woodDark, 0, 5.85, 0.6, 0.35, 0.7, 0.4);            // center strut
  g.position.set(11, G, 13);
  scene.add(g);
}

// ---------- 5-tier pagoda ----------
{
  const P = new THREE.Group();
  // stone plinth + steps at the entrance
  addBox(P, MAT.stone, 0, G + 0.25, -6, 14.4, 0.5, 12.4, false);
  addBox(P, MAT.stoneDark, 0, G + 0.42, -0.5, 4.4, 0.36, 2.2, false);
  addBox(P, MAT.stone, 0, G + 0.75, -0.9, 2.6, 0.7, 1.4);

  let y = G + 0.5, w = 12, d = 10;
  for (let t = 0; t < 5; t++) {
    const wallH = 3;
    // plaster walls
    addBox(P, t % 2 ? MAT.plaster2 : MAT.plaster, 0, y + wallH / 2, -6, w, wallH, d);
    // red columns on corners
    const cs = 0.45;
    const cz = -6;
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      addBox(P, MAT.red, sx * (w / 2 - cs / 2), y + wallH / 2, cz + sz * (d / 2 - cs / 2), cs, wallH, cs);
    }
    if (t < 3) {
      addBox(P, MAT.red, 0, y + wallH / 2, cz + d / 2 - cs / 2, cs, wallH, cs);   // entrance columns
      addBox(P, MAT.red, 0, y + wallH / 2, cz - d / 2 + cs / 2, cs, wallH, cs);
    }
    // door hint on tier 0 (dark recess)
    if (t === 0) addBox(P, MAT.woodDark, 0, y + 1.2, cz + d / 2 - 0.05, 1.8, 2.2, 0.18);
    // layered dark roof
    y += wallH;
    addBox(P, MAT.roof, 0, y + 0.45, -6, w + 3, 0.9, d + 3);
    addBox(P, MAT.roof2, 0, y + 1.08, -6, w + 1.5, 0.55, d + 1.5);
    y += 1.55;
    w -= 2.1; d -= 2.1;
  }
  // gold spire
  addBox(P, MAT.gold, 0, y + 0.5, -6, 0.7, 1, 0.7);
  addBox(P, MAT.gold, 0, y + 1.25, -6, 0.45, 0.7, 0.45);
  addBox(P, MAT.gold, 0, y + 1.85, -6, 0.28, 0.5, 0.28);
  scene.add(P);
}

// ---------- falling petals ----------
const PETALS = 140;
const petalGeo = new THREE.BoxGeometry(0.16, 0.02, 0.12);
const petalMat = new THREE.MeshStandardMaterial({ color: 0xffb0c8, roughness: 1 });
const petals = new THREE.InstancedMesh(petalGeo, petalMat, PETALS);
petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
petals.frustumCulled = false;
scene.add(petals);

const petalData = [];
for (let i = 0; i < PETALS; i++) {
  petalData.push({
    x: rnd(-15, 15), y: rnd(G + 2, G + 13), z: rnd(-11, 15),
    vy: rnd(0.5, 1.1), amp: rnd(0.4, 1.2), ph: rnd(0, Math.PI * 2),
    rx: rnd(0, Math.PI * 2), rz: rnd(0, Math.PI * 2),
    wx: rnd(1, 3), wz: rnd(1, 3),
  });
}
const dummy = new THREE.Object3D();

// ---------- resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- animate ----------
const clock = new THREE.Clock();
const waterBoxes = [];
scene.traverse(o => { if (o.isMesh && o.material === MAT.water) waterBoxes.push(o); });

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // water shimmer
  for (const w of waterBoxes) {
    w.position.y = G - 0.09 + Math.sin(t * 1.4 + w.position.x * 0.35 + w.position.z * 0.2) * 0.05;
  }

  // petals
  for (let i = 0; i < PETALS; i++) {
    const p = petalData[i];
    p.y -= p.vy * dt;
    p.rx += dt * p.wx;
    p.rz += dt * p.wz;
    if (p.y < G + 0.1) {
      p.y = rnd(G + 9, G + 14);
      p.x = rnd(-15, 15);
      p.z = rnd(-11, 15);
      p.rx = rnd(0, Math.PI * 2);
      p.rz = rnd(0, Math.PI * 2);
    }
    const x = p.x + Math.sin(t * 0.7 + p.ph) * p.amp;
    const z = p.z + Math.cos(t * 0.55 + p.ph) * p.amp;
    dummy.position.set(x, p.y, z);
    dummy.rotation.set(p.rx, t * 0.5 + p.ph, p.rz);
    dummy.updateMatrix();
    petals.setMatrixAt(i, dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}

document.getElementById('loader').remove();
animate();
</script>
</body>
</html>
